name: eval-nightly

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: eval-nightly
  cancel-in-progress: false

permissions:
  contents: write            # commit updated baseline
  issues: write              # open a regression issue

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AI_GATEWAY_API_KEY:      ${{ secrets.AI_GATEWAY_API_KEY }}
      DEVIN_API_KEY:           ${{ secrets.DEVIN_API_KEY }}
      CURSOR_API_KEY:          ${{ secrets.CURSOR_API_KEY }}
      CURSOR_REPOSITORY:       ${{ secrets.CURSOR_REPOSITORY }}
      CONTEXT_GRAPH_API_URL:   ${{ secrets.CONTEXT_GRAPH_API_URL }}
      CONTEXT_GRAPH_API_KEY:   ${{ secrets.CONTEXT_GRAPH_API_KEY }}
      GH_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run agent-benchmark
        run: pnpm eval agent-benchmark

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-${{ github.run_id }}
          path: runs/
          retention-days: 30

      - name: Check regression and open issue if needed
        if: success()
        run: node scripts/check-regression.mjs

      - name: Commit updated baseline
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain results/nightly-baseline.json)" ]; then
            git add results/nightly-baseline.json
            git commit -m "nightly baseline: run ${{ github.run_id }} [skip ci]"
            git push
          else
            echo "No baseline change to commit."
          fi

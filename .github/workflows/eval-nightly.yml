name: eval-nightly

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: eval-nightly
  cancel-in-progress: false

permissions:
  contents: write            # commit updated baseline
  issues: write              # open a regression issue

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AI_GATEWAY_API_KEY:      ${{ secrets.AI_GATEWAY_API_KEY }}
      # Direct provider keys — the harness prefers these and only falls back to
      # the gateway when one is unset (see src/core/providers.ts).
      ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
      GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
      # Optional: real per-account rate limits. Unset falls back to the
      # conservative lowest-tier defaults, which throttle hard.
      ANTHROPIC_RPM:      ${{ vars.ANTHROPIC_RPM }}
      ANTHROPIC_TPM:      ${{ vars.ANTHROPIC_TPM }}
      OPENAI_RPM:      ${{ vars.OPENAI_RPM }}
      OPENAI_TPM:      ${{ vars.OPENAI_TPM }}
      POSTMAN_CONTEXT_GRAPH_API_URL: ${{ secrets.POSTMAN_CONTEXT_GRAPH_API_URL }}
      POSTMAN_CONTEXT_GRAPH_API_KEY: ${{ secrets.POSTMAN_CONTEXT_GRAPH_API_KEY }}
      GH_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run model-benchmark
        run: pnpm eval model-benchmark

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-benchmark-${{ github.run_id }}
          path: runs/
          retention-days: 30

      - name: Check regression and open issue if needed
        if: success()
        run: node scripts/check-regression.mjs

      - name: Commit updated baseline
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain results/nightly-baseline.json)" ]; then
            git add results/nightly-baseline.json
            git commit -m "nightly baseline: run ${{ github.run_id }} [skip ci]"
            git push
          else
            echo "No baseline change to commit."
          fi

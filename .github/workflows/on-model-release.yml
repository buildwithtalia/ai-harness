name: on-model-release

# Entrypoint the release-autopilot skill calls to benchmark a new model or
# framework drop. See:
#   https://github.com/Postman-Devrel/devrel-claude-code-skills/pull/3
#
# Trigger the skill can use:
#   * workflow_dispatch (manual or via `gh workflow run on-model-release.yml`)
#   * repository_dispatch with event_type "new-model-release" and
#     client_payload matching the inputs below (POST /repos/.../dispatches)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "New model identifier (e.g. anthropic/claude-5-opus)"
        required: true
      catalogOnly:
        description: "Add to the model catalog but do not enroll in the A/B"
        required: false
        default: "false"
      releaseUrl:
        description: "Vendor release / model-card URL (recorded on the run)"
        required: false
      dispatchedBy:
        description: "Free-form label for the caller (e.g. 'skill:model-context-graph-comparison')"
        required: false
  repository_dispatch:
    types: [new-model-release]

concurrency:
  group: on-model-release-${{ github.event.inputs.model || github.event.client_payload.model }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_GATEWAY_API_KEY:       ${{ secrets.AI_GATEWAY_API_KEY }}
      # Direct provider keys — the harness prefers these and only falls back to
      # the gateway when one is unset (see src/core/providers.ts).
      CLAUDE_API_KEY:       ${{ secrets.CLAUDE_API_KEY }}
      OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
      GOOGLE_API_KEY:       ${{ secrets.GOOGLE_API_KEY }}
      # Optional: real per-account rate limits. Unset falls back to the
      # conservative lowest-tier defaults, which throttle hard.
      ANTHROPIC_RPM:       ${{ vars.ANTHROPIC_RPM }}
      ANTHROPIC_TPM:       ${{ vars.ANTHROPIC_TPM }}
      OPENAI_RPM:       ${{ vars.OPENAI_RPM }}
      OPENAI_TPM:       ${{ vars.OPENAI_TPM }}
      POSTMAN_CONTEXT_GRAPH_API_URL: ${{ secrets.POSTMAN_CONTEXT_GRAPH_API_URL }}
      POSTMAN_CONTEXT_GRAPH_API_KEY: ${{ secrets.POSTMAN_CONTEXT_GRAPH_API_KEY }}
      SKILL_WEBHOOK_URL:        ${{ secrets.SKILL_WEBHOOK_URL }}
      SKILL_WEBHOOK_TOKEN:      ${{ secrets.SKILL_WEBHOOK_TOKEN }}
      SKILL_TRIGGER_MODEL:      ${{ github.event.inputs.model || github.event.client_payload.model }}
      SKILL_TRIGGER_CATALOG_ONLY: ${{ github.event.inputs.catalogOnly || github.event.client_payload.catalogOnly }}
      SKILL_TRIGGER_RELEASE_URL: ${{ github.event.inputs.releaseUrl || github.event.client_payload.releaseUrl }}
      SKILL_TRIGGER_DISPATCHED_BY: ${{ github.event.inputs.dispatchedBy || github.event.client_payload.dispatchedBy || github.event.action }}
      GH_TOKEN:                 ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply model update
        run: |
          EXTRA=""
          if [ "${SKILL_TRIGGER_CATALOG_ONLY:-false}" = "true" ]; then EXTRA="--catalog-only"; fi
          node scripts/apply-model-update.mjs --model="$SKILL_TRIGGER_MODEL" $EXTRA

      - name: Type-check
        run: pnpm build

      - name: Run model-benchmark
        run: pnpm eval model-benchmark

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-model-release-${{ github.run_id }}
          path: |
            runs/
            results/skill-input.json
          retention-days: 30

      - name: Commit catalog change on success
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/core/models.ts src/evals/model-benchmark.ts)" ]; then
            git add src/core/models.ts src/evals/model-benchmark.ts
            git commit -m "eval: ${SKILL_TRIGGER_MODEL} on model-benchmark [skip ci]"
            git push
          else
            echo "No catalog change to commit."
          fi

name: pr-eval-smoke

on:
  pull_request:
    paths:
      - 'src/evals/**'
      - '.github/workflows/pr-eval-smoke.yml'

concurrency:
  group: pr-eval-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Smoke run exercises one cheap model in both arms — enough to prove the
      # A/B wiring end-to-end without a meaningful bill.
      AI_GATEWAY_API_KEY:      ${{ secrets.AI_GATEWAY_API_KEY }}
      POSTMAN_CONTEXT_GRAPH_API_URL: ${{ secrets.POSTMAN_CONTEXT_GRAPH_API_URL }}
      POSTMAN_CONTEXT_GRAPH_API_KEY: ${{ secrets.POSTMAN_CONTEXT_GRAPH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke run — 2 cases × haiku baseline vs +cg
        run: |
          pnpm eval model-benchmark --limit=2 \
            --models=anthropic/claude-haiku-4-5,anthropic/claude-haiku-4-5+cg

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: runs/
          retention-days: 7
